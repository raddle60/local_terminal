<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CMD (Windows Command Prompt) -->
  <rect width="64" height="64" rx="10" fill="#0c0c0c"/>
  <!-- Window title bar -->
  <rect x="0" y="0" width="64" height="18" rx="5" fill="#1a1a1a"/>
  <rect x="0" y="10" width="64" height="8" fill="#1a1a1a"/>
  <text x="6" y="13" font-family="Arial" font-size="8" fill="#cccccc">Command Prompt</text>
  <!-- Prompt text -->
  <text x="6" y="34" font-family="monospace" font-size="11" fill="#cccccc">C:\&gt;_</text>
  <!-- Path line 2 -->
  <text x="6" y="48" font-family="monospace" font-size="9" fill="#666666">cmd.exe</text>
  <!-- Label -->
  <text x="4" y="61" font-family="monospace" font-size="11" fill="#aaaaaa" letter-spacing="1">cmd</text>
</svg>
