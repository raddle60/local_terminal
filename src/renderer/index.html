<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Terminal</title>
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Custom Title Bar -->
  <div class="title-bar">
    <span class="title-bar-title">Terminal</span>
    <div class="title-bar-controls">
      <button class="title-bar-btn" id="btn-minimize">─</button>
      <button class="title-bar-btn" id="btn-maximize">□</button>
      <button class="title-bar-btn title-bar-btn-close" id="btn-close">×</button>
    </div>
  </div>

  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Profiles</span>
        <button id="add-profile-btn" class="add-profile-btn" title="新增 Profile">+</button>
      </div>
      <div id="profile-tree" class="profile-tree-container"></div>
    </div>
    <div class="main-content">
      <div id="tab-bar" class="tab-bar"></div>
      <div id="terminal-container" class="terminal-container"></div>
    </div>
  </div>

  <!-- Profile Dialog -->
  <div id="profile-dialog" class="dialog-overlay hidden">
    <div class="dialog dialog-large">
      <div class="dialog-header">
        <span id="dialog-title" class="dialog-title">Profile</span>
        <button id="dialog-close" class="dialog-close">×</button>
      </div>
      <div class="dialog-content">
        <div class="form-group">
          <label class="form-label">名称</label>
          <input type="text" id="profile-name" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">图标</label>
          <input type="text" id="profile-icon" class="form-input" placeholder="图标文件路径">
        </div>
        <div class="form-group">
          <label class="form-label">Shell 程序</label>
          <input type="text" id="profile-shell" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">启动目录</label>
          <input type="text" id="profile-cwd" class="form-input">
        </div>
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label">自动脚本</label>
            <button id="add-script-btn" class="btn-small">+ 添加</button>
          </div>
          <div id="auto-scripts-container" class="auto-scripts-container"></div>
        </div>
      </div>
      <div class="dialog-footer">
        <button id="dialog-cancel" class="btn btn-secondary">取消</button>
        <button id="dialog-save" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="dialog-overlay hidden">
    <div class="dialog dialog-small">
      <div class="dialog-header">
        <span id="confirm-title" class="dialog-title">确认</span>
      </div>
      <div class="dialog-content">
        <p id="confirm-message"></p>
      </div>
      <div class="dialog-footer">
        <button id="confirm-cancel" class="btn btn-secondary">取消</button>
        <button id="confirm-ok" class="btn btn-danger">确定</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
